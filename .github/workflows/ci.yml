name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, and test
        run: bun run check:ts

      - name: Memory cutover gate
        run: bash scripts/check-memory-cutover.sh

  # Electron end-to-end check. Informational until it is proven on CI hardware:
  # it launches a real BrowserWindow under xvfb, so a runner-side flake must not
  # block a merge. Promote to blocking once it has a stable track record.
  desktop-native:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Native desktop window (Electron + Vite)
        run: xvfb-run -a bun run --filter '@paw/desktop' test:native

  memory-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: paw
          POSTGRES_PASSWORD: paw
          POSTGRES_DB: paw_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paw -d paw_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://paw:paw@localhost:5432/paw_memory_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply memory migrations
        run: bun run memory:migrate

      # The whole DB-gated suite, not a hand-maintained file list: the previous
      # 17-file enumeration silently skipped new tests.
      - name: Memory suite (DATABASE_URL required)
        run: bun run test:memory

      - name: Agent memory cutover tests
        run: |
          bun test packages/agent/test/memory-runtime-cutover.test.ts
          bun test packages/agent/test/memory-v2-cutover.test.ts
